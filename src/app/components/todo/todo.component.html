<li
  [ngClass]="{
    completed: todo().completed,
    editing: editingMode,
  }"
  (dblclick)="enableEditingMode()"
>
  <div class="view">
    <input [checked]="todo().completed" (change)="toggle()" class="toggle" type="checkbox" />
    <label>{{ todo().title }}</label>
    <button type="button" class="destroy" (click)="remove()"></button>
  </div>
  <input
    #inputElement
    class="edit"
    [formControl]="titleControl"
    (keyup.enter)="update()"
    (keyup.esc)="escape()"
  />
</li>
